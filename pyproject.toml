[project]
name = "pp-container-manager"
version = "0.1.0"
description = "Private Ubuntu container control plane"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "grpcio>=1.78,<2", "protobuf>=6.33.5,<7"]

[dependency-groups]
dev = ["black>=25,<27", "pytest>=8,<10", "grpcio-tools>=1.78,<1.79"]

[project.scripts]
container-manager = "container_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["container_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
